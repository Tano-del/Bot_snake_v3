name: Tests Automaticos de Snake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testear-codigo:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Instalar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov websockets torch numpy xenon

    - name: Correr los tests con Cobertura
      run: |
        pytest --cov=run_v3 --cov-report=term-missing --cov-fail-under=90
